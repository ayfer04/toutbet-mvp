security:
  # STRIDE: Elevation of Privilege — hiérarchie minimale, aucun rôle admin exposé par l'API.
  role_hierarchy:
    ROLE_BOOKIE: ROLE_PARIEUR

  password_hashers:
    App\Entity\User:
      algorithm: argon2id

  providers:
    app_user_provider:
      entity:
        class: App\Entity\User
        property: email

  firewalls:
    dev:
      pattern: ^/(_wdt|_profiler)
      security: false
    api:
      pattern: ^/api
      stateless: true
      lazy: true
      provider: app_user_provider
      custom_authenticators:
        - App\Security\JwtAuthenticator

  access_control:
    - { path: ^/api/register$, roles: PUBLIC_ACCESS }
    - { path: ^/api/login$, roles: PUBLIC_ACCESS }
    - { path: ^/api/refresh$, roles: PUBLIC_ACCESS }
    - { path: ^/api/verify-email$, roles: PUBLIC_ACCESS }
    - { path: ^/api/webhooks/payment$, roles: PUBLIC_ACCESS }
    - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
