doctrine:
  dbal:
    url: '%env(resolve:DATABASE_URL)%'
    server_version: '16'
  orm:
    auto_generate_proxy_classes: true
    enable_lazy_ghost_objects: true
    # Propriétés camelCase -> colonnes snake_case (password_hash, refresh_token_hash...), comme dans les migrations.
    naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
    auto_mapping: true
    # Correction : le socle généré ne déclarait pas le dossier des entités de l'application.
    mappings:
      App:
        type: attribute
        is_bundle: false
        dir: '%kernel.project_dir%/src/Entity'
        prefix: 'App\Entity'
        alias: App
