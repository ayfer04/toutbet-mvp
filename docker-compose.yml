services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: toutbet
      POSTGRES_USER: toutbet_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toutbet_app -d toutbet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
