services:
  api:
    build: .
    volumes:
      - ./:/app
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: toutbet
      POSTGRES_USER: toutbet_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # Base non exposée sur l'hôte : seul le service api y accède (réseau interne Docker).
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toutbet_app -d toutbet"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
